# Runs the Faith Clips Finder's safety tests whenever its code or settings change.
name: Faith Clips - Tests

on:
  push:
    paths: ["faith-clips/**", ".github/workflows/faith-clips-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: faith-clips
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: faith-clips/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests
