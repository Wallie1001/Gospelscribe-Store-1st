<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gospelscribe · The Book of Matthew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --umber:#15110E; --umber-2:#211A15; --parch:#E8DCC4; --parch-dim:#BFB29A;
  --gold:#C9A24D; --gold-hi:#E6C878; --crimson:#A5282A; --bronze:#6B5A48;
  --display:'IM Fell English','Iowan Old Style',Palatino,Georgia,serif;
  --caps:'IM Fell English SC','IM Fell English',Palatino,Georgia,serif;
  --body:'Cardo','Iowan Old Style',Palatino,Georgia,serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"],:root:not([data-theme="light"]){--x:0}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--umber);color:var(--parch);font-family:var(--body);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
img{max-width:100%}

/* ---------- Top bar ---------- */
.bar{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;justify-content:space-between;align-items:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;
  background:linear-gradient(180deg,rgba(15,11,9,.85),rgba(15,11,9,0));
  opacity:0;pointer-events:none;transition:opacity .6s;
}
body.entered .bar{opacity:1;pointer-events:auto}
.mark{font-family:var(--display);font-size:1.45rem;letter-spacing:.01em;background:none;border:0;padding:0;color:var(--parch)}
.bar-actions{display:flex;gap:4px}
.bar-btn{background:none;border:0;padding:8px 10px;font-family:var(--caps);font-size:1.02rem;color:var(--parch)}
.bar-btn:hover{color:var(--gold-hi)}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--crimson);font-family:var(--body);font-size:.75rem;margin-left:4px;padding:0 5px}

/* ---------- Scenes (shared) ---------- */
.scene{position:relative;min-height:100vh;min-height:100svh;display:flex;overflow:hidden;isolation:isolate}
.scene-bg{position:absolute;inset:0;z-index:-2}
.scene-bg img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04)}
.scene-bg img.broken{display:none}
.scene::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none}

/* painted fallbacks shown when an image isn't loaded */
.fb-lamp{background:radial-gradient(ellipse at 50% 58%,rgba(230,176,90,.45),rgba(120,70,25,.18) 25%,transparent 55%),#0D0A08}
.fb-gate{background:radial-gradient(ellipse at 66% 55%,rgba(230,190,110,.5),transparent 40%),radial-gradient(ellipse at 34% 55%,rgba(40,30,22,.9),transparent 40%),linear-gradient(#1A1411,#0C0908)}
.fb-bethlehem{background:radial-gradient(circle at 62% 16%,rgba(245,225,160,.9),rgba(227,194,122,.25) 6%,transparent 22%),linear-gradient(#131A2C,#0E0C0B 80%)}
.fb-wilderness{background:radial-gradient(ellipse at 75% 30%,rgba(236,170,80,.55),transparent 45%),linear-gradient(#7A4E22,#2A1A0D 70%,#120C08)}
.fb-galilee{background:radial-gradient(ellipse at 78% 12%,rgba(230,190,110,.55),transparent 32%),linear-gradient(#2E3B40,#101618 75%)}
.fb-cross{background:radial-gradient(ellipse at 50% 18%,rgba(200,170,140,.25),transparent 30%),linear-gradient(#3A1414,#1A1212 60%,#0E0A0A)}
.fb-tomb{background:radial-gradient(ellipse at 45% 55%,rgba(255,220,160,.7),rgba(233,185,138,.25) 18%,transparent 45%),linear-gradient(#5A3A30,#16100D 80%)}
.fb-mountain{background:radial-gradient(ellipse at 50% 38%,rgba(240,168,80,.8),rgba(240,168,80,.2) 22%,transparent 50%),linear-gradient(#6A3C1C,#1A120C 75%)}

/* ---------- Opening ---------- */
.intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;transition:opacity 1.2s ease}
.intro::after{background:radial-gradient(ellipse at center,rgba(0,0,0,.1),rgba(0,0,0,.75) 75%)}
.intro.gone{opacity:0;pointer-events:none}
.glow{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(255,190,100,.18),transparent 45%);animation:flicker 3.2s infinite}
@keyframes flicker{0%,100%{opacity:.85}20%{opacity:1}35%{opacity:.7}50%{opacity:.95}72%{opacity:.8}}
.intro-inner{padding:24px;max-width:640px;opacity:0;animation:rise 1.6s ease .6s forwards}
@keyframes rise{to{opacity:1}}
.intro h1{font-family:var(--display);font-weight:400;font-size:clamp(3.2rem,12vw,6.4rem);line-height:.95;margin:0;color:var(--parch);text-shadow:0 2px 30px rgba(0,0,0,.8)}
.intro p{font-family:var(--display);font-style:italic;font-size:clamp(1.2rem,3.4vw,1.6rem);color:var(--gold-hi);margin:14px 0 36px}
.gold-btn{
  background:rgba(12,9,7,.55);border:1px solid var(--gold);color:var(--gold-hi);
  padding:14px 30px;font-family:var(--caps);font-size:1.15rem;letter-spacing:.06em;border-radius:1px;
}
.gold-btn:hover{background:rgba(201,162,77,.15)}
.intro small{display:block;margin-top:18px;font-style:italic;color:var(--parch-dim);font-size:.95rem}

/* ---------- Gate ---------- */
.gate{align-items:center;justify-content:center;text-align:center;padding:120px 20px 80px}
.gate::after{background:linear-gradient(180deg,rgba(10,8,6,.65),rgba(10,8,6,.35) 40%,rgba(10,8,6,.85))}
.gate h2{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,6vw,3.6rem);margin:0 0 8px}
.gate .sub{font-style:italic;color:var(--parch-dim);font-size:1.15rem;margin:0 0 36px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:640px;margin:0 auto}
.door{
  padding:34px 18px;border:1px solid rgba(201,162,77,.45);background:rgba(12,9,7,.6);
  border-radius:120px 120px 2px 2px;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
}
.door strong{font-family:var(--display);font-weight:400;font-size:1.55rem;line-height:1.1}
.door span{font-family:var(--caps);font-size:.98rem;letter-spacing:.06em;color:var(--parch-dim)}
.door.open{border-color:var(--gold);box-shadow:inset 0 0 60px rgba(201,162,77,.18)}
.door.open span{color:var(--gold-hi)}
.door.open:hover{background:rgba(40,28,14,.7)}
.door[disabled]{cursor:not-allowed;opacity:.72}
.seal{width:30px;height:30px;border-radius:50%;background:var(--crimson);margin:0 auto 8px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.books{max-width:640px;margin:34px auto 0;display:none}
.books.show{display:block;animation:rise .8s ease forwards;opacity:0}
.books h3{font-family:var(--caps);font-weight:400;font-size:1.1rem;letter-spacing:.08em;color:var(--gold-hi);margin:0 0 14px}
.book-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.book{padding:16px 8px;border:1px solid rgba(232,220,196,.2);background:rgba(12,9,7,.6);border-radius:2px}
.book b{display:block;font-family:var(--display);font-weight:400;font-size:1.3rem}
.book small{font-family:var(--caps);color:var(--parch-dim);font-size:.85rem;letter-spacing:.05em}
.book.open{border-color:var(--gold)}
.book.open small{color:var(--gold-hi)}
.book[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- Journey stops ---------- */
.stop{align-items:flex-end;padding:120px 24px 64px 64px}
.stop::after{background:linear-gradient(180deg,rgba(10,8,6,.2) 0%,rgba(10,8,6,.15) 35%,rgba(10,8,6,.88) 80%,rgba(10,8,6,.96))}
.stop-inner{max-width:1120px;width:100%;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr);gap:48px;align-items:end}
.ref{font-family:var(--caps);letter-spacing:.08em;color:var(--gold-hi);font-size:1.05rem;margin:0 0 6px}
.place{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,7vw,4.8rem);line-height:1;margin:0 0 20px;text-shadow:0 2px 24px rgba(0,0,0,.7)}
.verse{font-family:var(--display);font-style:italic;font-size:clamp(1.25rem,2.6vw,1.6rem);line-height:1.45;margin:0 0 6px;max-width:34em}
.verse.red{color:#E07A6E}
.verse-ref{font-family:var(--caps);color:var(--parch-dim);letter-spacing:.06em;margin:0 0 22px}
.story{font-size:1.1rem;line-height:1.7;color:var(--parch);max-width:36em;margin:0}
.piece-card{
  background:rgba(14,11,9,.78);border:1px solid rgba(201,162,77,.4);padding:18px;border-radius:2px;
  display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;text-align:left;width:100%;
}
.piece-card:hover{border-color:var(--gold)}
.piece-card .ph{background:var(--umber-2);aspect-ratio:1/1.1;display:grid;place-items:center;border:1px solid rgba(232,220,196,.08)}
.piece-card h4{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0 0 4px;line-height:1.15}
.piece-card p{margin:0;color:var(--parch-dim);font-size:.95rem}
.piece-card .go{display:inline-block;margin-top:8px;font-family:var(--caps);color:var(--gold-hi);letter-spacing:.05em}
.silence{font-family:var(--display);font-style:italic;color:var(--parch-dim);font-size:1.1rem;border-left:1px solid var(--crimson);padding-left:16px;margin:0}
.commission{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.plain-btn{background:none;border:1px solid rgba(232,220,196,.35);color:var(--parch);padding:13px 22px;font-family:var(--caps);font-size:1.05rem;letter-spacing:.05em;border-radius:1px;text-decoration:none}
.plain-btn:hover{border-color:var(--parch)}

/* progress rail */
.rail{position:fixed;left:22px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:18px;opacity:0;pointer-events:none;transition:opacity .4s}
.rail.show{opacity:1;pointer-events:auto}
.rail::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:rgba(201,162,77,.35);z-index:-1}
.rail a{display:block;width:11px;height:11px;border-radius:50%;border:1px solid var(--gold);background:var(--umber);position:relative}
.rail a[aria-current="true"]{background:var(--gold);box-shadow:0 0 12px rgba(201,162,77,.8)}
.rail a span{position:absolute;left:22px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:var(--caps);font-size:.9rem;color:var(--parch);opacity:0;transition:opacity .2s;pointer-events:none;text-shadow:0 1px 6px #000}
.rail a:hover span,.rail a:focus-visible span,.rail a[aria-current="true"] span{opacity:1}

/* ---------- Shop ---------- */
.shop{padding:110px 24px 90px;max-width:1120px;margin:0 auto}
.shop h2{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,6vw,3.4rem);margin:0 0 8px;text-align:center}
.shop .sub{text-align:center;font-style:italic;color:var(--parch-dim);margin:0 0 40px;font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px}
.tile{background:none;border:0;padding:0;text-align:left}
.tile .ph{background:var(--umber-2);aspect-ratio:4/5;display:grid;place-items:center;border:1px solid rgba(232,220,196,.08);margin-bottom:12px}
.tile:hover .ph{border-color:rgba(201,162,77,.5)}
.tile h4{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0 0 2px}
.tile p{margin:0;font-family:var(--caps);color:var(--parch-dim);letter-spacing:.05em;font-size:.92rem}
.foot{text-align:center;padding:40px 20px 70px;border-top:1px solid rgba(201,162,77,.2);color:var(--parch-dim);font-style:italic}
.foot b{font-family:var(--caps);font-style:normal;color:var(--gold-hi);font-weight:400;letter-spacing:.06em}

/* ---------- Sheet + bag ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;z-index:61;left:50%;bottom:0;width:min(880px,100%);max-height:92vh;overflow-y:auto;
  transform:translate(-50%,105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);
  background:var(--umber-2);border-top:2px solid var(--gold);
  padding:26px 26px calc(26px + env(safe-area-inset-bottom,0px));
}
.sheet.show{transform:translate(-50%,0)}
.sheet-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:32px}
.sheet .ph{background:var(--umber);aspect-ratio:4/5;display:grid;place-items:center;border:1px solid rgba(232,220,196,.08)}
.sheet .ph small{display:block;text-align:center;font-style:italic;color:var(--bronze);margin-top:8px}
.x{position:absolute;top:10px;right:12px;background:none;border:0;font-size:1.8rem;line-height:1;padding:6px 10px;color:var(--parch)}
.s-ref{font-family:var(--caps);color:var(--gold-hi);letter-spacing:.08em;margin:0}
.s-name{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,4vw,2.4rem);line-height:1.1;margin:6px 0 4px}
.s-price{color:var(--parch-dim);font-style:italic;margin:0 0 18px}
.s-note{border-left:1px solid var(--gold);padding-left:16px;margin:18px 0 22px;line-height:1.7;font-size:1.05rem}
.lbl{display:block;font-family:var(--caps);letter-spacing:.06em;color:var(--parch-dim);margin-bottom:10px}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.size{min-width:50px;height:44px;padding:0 12px;background:none;border:1px solid rgba(232,220,196,.3);border-radius:1px}
.size[aria-pressed="true"]{background:var(--parch);color:var(--umber);border-color:var(--parch)}
.add{width:100%;padding:16px;border:0;border-radius:1px;background:var(--crimson);color:#fff;font-family:var(--caps);font-size:1.15rem;letter-spacing:.06em}
.add:hover{filter:brightness(1.1)}
.hint{min-height:1.4em;margin:8px 0 0;color:#E07A6E;font-style:italic}
.bag{
  position:fixed;top:0;right:0;bottom:0;z-index:62;width:min(400px,100%);background:var(--umber-2);border-left:2px solid var(--gold);
  padding:calc(22px + env(safe-area-inset-top,0px)) 24px calc(22px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;transform:translateX(105%);transition:transform .3s ease;
}
.bag.show{transform:none}
.bag h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid rgba(201,162,77,.3)}
.bag ul{list-style:none;margin:0;padding:0;flex:1;overflow-y:auto}
.bag li{display:flex;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid rgba(232,220,196,.1)}
.bag li b{font-family:var(--display);font-weight:400;font-size:1.1rem;display:block}
.bag li small{color:var(--parch-dim)}
.rm{background:none;border:0;color:var(--parch-dim);text-decoration:underline;padding:4px}
.empty{padding:40px 0;text-align:center;font-style:italic;color:var(--parch-dim)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--parch);color:var(--umber);padding:12px 20px;max-width:90vw;text-align:center;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .stop{padding:110px 20px 48px 44px}
  .stop-inner{grid-template-columns:1fr;gap:26px}
  .rail{left:14px;gap:14px}
  .rail a span{display:none}
  .sheet-grid{grid-template-columns:1fr;gap:18px}
  .sheet .ph{aspect-ratio:16/10}
}
@media (max-width:480px){
  .doors{grid-template-columns:1fr 1fr;gap:10px}
  .door{min-height:170px;padding:24px 10px}
  .door strong{font-size:1.25rem}
  .book-row{grid-template-columns:1fr 1fr}
  .bar{padding-left:14px;padding-right:10px}
  .mark{font-size:1.2rem}
  .bar-btn{padding:8px 6px;font-size:.95rem}
}
@media (prefers-reduced-motion:reduce){
  .glow{animation:none}
  .intro-inner,.books.show{animation:none;opacity:1}
  .intro,.sheet,.bag,.scrim,.toast,.bar,.rail{transition:none}
}
</style>
</head>
<body class="locked">

<header class="bar">
  <button class="mark" data-jump="gate">Gospelscribe</button>
  <div class="bar-actions">
    <button class="bar-btn" data-jump="shop">Skip to shop</button>
    <button class="bar-btn" id="bagBtn">Bag<span class="count" id="count">0</span></button>
  </div>
</header>

<section class="scene intro" id="intro" aria-label="Opening">
  <div class="scene-bg fb-lamp"><img data-scene="lamp" alt=""></div>
  <div class="glow" aria-hidden="true"></div>
  <div class="intro-inner">
    <h1>Gospelscribe</h1>
    <p>Wear the Word</p>
    <button class="gold-btn" id="openBtn">Open the book</button>
    <small>The Book of Matthew drop is here.</small>
  </div>
</section>

<main>
<section class="scene gate" id="gate" aria-labelledby="gateTitle">
  <div class="scene-bg fb-gate"><img data-scene="gate" alt=""></div>
  <div style="width:100%">
    <h2 id="gateTitle">Where will you begin?</h2>
    <p class="sub">Every drop is a book of the Bible.</p>
    <div class="doors">
      <button class="door" disabled aria-label="Old Testament, sealed, coming soon">
        <div class="seal" aria-hidden="true"></div>
        <strong>The Old Testament</strong><span>Sealed · Coming soon</span>
      </button>
      <button class="door open" id="ntDoor">
        <strong>The New Testament</strong><span>Enter</span>
      </button>
    </div>
    <div class="books" id="books">
      <h3>The Gospels</h3>
      <div class="book-row">
        <button class="book open" data-jump="stop-bethlehem"><b>Matthew</b><small>Open now</small></button>
        <button class="book" disabled><b>Mark</b><small>Sealed</small></button>
        <button class="book" disabled><b>Luke</b><small>Sealed</small></button>
        <button class="book" disabled><b>John</b><small>Sealed</small></button>
      </div>
    </div>
  </div>
</section>

<div id="journey"></div>

<section class="shop" id="shop" aria-labelledby="shopTitle">
  <h2 id="shopTitle">The Book of Matthew</h2>
  <p class="sub">Five pieces. Five moments. One story.</p>
  <div class="grid" id="grid"></div>
</section>
<footer class="foot">Next to open: <b>Mark</b> · The Old Testament remains sealed</footer>
</main>

<nav class="rail" id="rail" aria-label="Journey through Matthew"></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sName"></div>
<aside class="bag" id="bag" role="dialog" aria-modal="true" aria-label="Your bag">
  <button class="x" id="closeBag" aria-label="Close bag">×</button>
  <h2>Your bag</h2>
  <ul id="bagList"></ul>
  <button class="add" id="checkout">Checkout</button>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
/* Scene art: replace these with the final uploaded images */
const ART={
  lamp:'https://d8j0ntlcm91z4.cloudfront.net/user_38hCSqRrQYUYpHFpLBY4eF0UnvE/hf_20260925_043255_99103f9a-5d85-466f-b1b1-6f8c2b224b35.png',
  gate:'https://d8j0ntlcm91z4.cloudfront.net/user_38hCSqRrQYUYpHFpLBY4eF0UnvE/hf_20260925_043255_6a4834a6-ecca-497f-b3f2-07128e723c00.png',
  bethlehem:'https://d8j0ntlcm91z4.cloudfront.net/user_38hCSqRrQYUYpHFpLBY4eF0UnvE/hf_20260925_043255_d3866415-a081-4475-b978-933fb9889170.png',
  wilderness:'https://d8j0ntlcm91z4.cloudfront.net/user_38hCSqRrQYUYpHFpLBY4eF0UnvE/hf_20260925_043255_14c06e93-748c-45d1-bc58-371d537ddf9f.png',
  galilee:'https://d8j0ntlcm91z4.cloudfront.net/user_38hCSqRrQYUYpHFpLBY4eF0UnvE/hf_20260925_043103_094e58a1-5808-4b1a-a273-1d3c887c7b75.png',
  cross:'https://d8j0ntlcm91z4.cloudfront.net/user_38hCSqRrQYUYpHFpLBY4eF0UnvE/hf_20260925_043255_145523c8-a0b8-4168-96b2-73b6dd09b4d5.png',
  tomb:'https://d8j0ntlcm91z4.cloudfront.net/user_38hCSqRrQYUYpHFpLBY4eF0UnvE/hf_20260925_043255_06878797-da01-452c-a61a-472593287958.png',
  mountain:'https://d8j0ntlcm91z4.cloudfront.net/user_38hCSqRrQYUYpHFpLBY4eF0UnvE/hf_20260925_043255_696b7809-19c0-42ba-b84c-125a6d51793a.png'
};

const STOPS=[
 {id:'bethlehem',place:'Bethlehem',ref:'Matthew 1:18 – 2:12',red:false,
  verse:'They shall call his name Emmanuel, which being interpreted is, God with us.',vref:'Matthew 1:23',
  story:'Matthew tells the birth of Jesus Christ, from Joseph learning of Mary’s pregnancy to the arrival of the wise men. Jesus is introduced as Immanuel, God with us: the Savior arriving and the beginning of His earthly life.',
  piece:'born'},
 {id:'wilderness',place:'The Wilderness',ref:'Matthew 4:1 – 11',red:true,
  verse:'It is written, Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God.',vref:'Matthew 4:4',
  story:'After fasting forty days and nights, Jesus is tempted by Satan. Each time, He answers with Scripture, beginning with the words “It is written.” The power of knowing God’s Word and standing on it when temptation comes.',
  piece:'written'},
 {id:'galilee',place:'The Sea of Galilee',ref:'Matthew 14:22 – 33',red:false,
  verse:'But when he saw the wind boisterous, he was afraid; and beginning to sink, he cried, saying, Lord, save me.',vref:'Matthew 14:30',
  story:'Peter steps out of the boat and walks toward Jesus on the water. When fear of the wind and waves takes over, he begins to sink and cries out. Jesus immediately reaches out His hand and saves him. Even when faith is shaken, we can still call on Jesus.',
  piece:'saveme'},
 {id:'cross',place:'Golgotha',ref:'Matthew 27',red:true,
  verse:'Eli, Eli, lama sabachthani? that is to say, My God, my God, why hast thou forsaken me?',vref:'Matthew 27:46',
  story:'Jesus is crucified outside Jerusalem. Darkness covers the land, and He gives up His life for the sins of the world.',
  piece:null},
 {id:'tomb',place:'The Empty Tomb',ref:'Matthew 28:1 – 10',red:false,
  verse:'He is not here: for he is risen, as he said.',vref:'Matthew 28:6',
  story:'Mary Magdalene and the other Mary come to the tomb and find it empty. An angel tells them Jesus has risen, just as He said He would. The resurrection: the empty tomb and the victory over death.',
  piece:'risen'},
 {id:'mountain',place:'The Mountain in Galilee',ref:'Matthew 28:16 – 20',red:true,
  verse:'Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost.',vref:'Matthew 28:19',
  story:'After His resurrection, Jesus meets His disciples and gives the Great Commission. They are called to baptize, teach, and carry His message into the world. Take what you have learned from Scripture and share it.',
  piece:'disciples',last:true}
];

const PIECES={
 born:{name:'A Savior Is Born',ref:'Matthew 1–2',note:'This piece represents the arrival of the Savior and the beginning of the earthly life of Jesus. Inspired by Matthew 1:18–25 and 2:1–12.'},
 written:{name:'It Is Written',ref:'Matthew 4:1–11',note:'This piece represents the power of knowing God’s Word and standing on Scripture when temptation comes. Inspired by Matthew 4:1–11, especially 4:4.'},
 saveme:{name:'Lord, Save Me',ref:'Matthew 14:30',note:'A reminder that even when our faith becomes shaken and fear takes over, we can still call on Jesus. Inspired by Matthew 14:30.'},
 risen:{name:'He Is Not Here / He Has Risen',ref:'Matthew 28:1–10',note:'This piece represents the resurrection of Jesus Christ: the empty tomb and the victory over death. Inspired by Matthew 28:1–10.'},
 disciples:{name:'Go and Make Disciples',ref:'Matthew 28:16–20',note:'This piece represents the mission to take what we’ve learned from Scripture and share it with others. Inspired by Matthew 28:16–20.'}
};
const SIZES=['S','M','L','XL','2XL'];
const $=s=>document.querySelector(s);

const tee=(w)=>`<svg viewBox="0 0 200 220" width="${w}" aria-hidden="true"><path d="M60 24 L84 14 Q100 30 116 14 L140 24 L186 54 L166 88 L148 78 L148 208 L52 208 L52 78 L34 88 L14 54 Z" fill="none" stroke="#6B5A48" stroke-width="2"/><path d="M84 14 Q100 32 116 14" fill="none" stroke="#6B5A48" stroke-width="2"/></svg>`;

/* build journey */
$('#journey').innerHTML=STOPS.map((s,i)=>{
  const p=s.piece&&PIECES[s.piece];
  const right=p?`<button class="piece-card" data-piece="${s.piece}">
      <span class="ph">${tee(64)}</span>
      <span><h4>${p.name}</h4><p>The piece from this moment</p><span class="go">View piece</span></span>
    </button>`:`<p class="silence">No piece here. Just the cross.</p>`;
  const extra=s.last?`<div class="commission"><button class="gold-btn" data-jump="shop">Shop the collection</button><a class="plain-btn" href="https://af.uppromote.com/Gospelscribe/register" target="_blank" rel="noopener">Become an ambassador</a></div>`:'';
  return `<section class="scene stop" id="stop-${s.id}" aria-labelledby="t-${s.id}">
    <div class="scene-bg fb-${s.id}"><img data-scene="${s.id}" alt="" loading="lazy"></div>
    <div class="stop-inner">
      <div>
        <p class="ref">${s.ref}</p>
        <h2 class="place" id="t-${s.id}">${s.place}</h2>
        <p class="verse ${s.red?'red':''}">${s.verse}</p>
        <p class="verse-ref">${s.vref}</p>
        <p class="story">${s.story}</p>
        ${extra}
      </div>
      <div>${right}</div>
    </div>
  </section>`;
}).join('');

$('#rail').innerHTML=STOPS.map(s=>`<a href="#stop-${s.id}" data-id="${s.id}" aria-label="${s.place}"><span>${s.place}</span></a>`).join('');

$('#grid').innerHTML=Object.entries(PIECES).map(([k,p])=>`
  <button class="tile" data-piece="${k}"><span class="ph">${tee(110)}</span><h4>${p.name}</h4><p>${p.ref}</p></button>`).join('');

/* load art, fall back to painted gradients if blocked */
document.querySelectorAll('img[data-scene]').forEach(img=>{
  img.addEventListener('error',()=>img.classList.add('broken'));
  img.src=ART[img.dataset.scene];
});

/* opening */
$('#openBtn').addEventListener('click',()=>{
  $('#intro').classList.add('gone');
  document.body.classList.remove('locked');
  document.body.classList.add('entered');
  setTimeout(()=>$('#ntDoor').focus({preventScroll:true}),900);
});
$('#ntDoor').addEventListener('click',()=>{
  $('#books').classList.add('show');
  $('#ntDoor').querySelector('span').textContent='Open';
});

/* jumps */
document.addEventListener('click',e=>{
  const j=e.target.closest('[data-jump]');
  if(j){e.preventDefault();closeAll();document.getElementById(j.dataset.jump).scrollIntoView();return}
  const p=e.target.closest('[data-piece]');
  if(p){openPiece(p.dataset.piece);return}
});

/* rail tracking */
const rail=$('#rail');
const io=new IntersectionObserver(es=>{
  es.forEach(en=>{
    if(en.isIntersecting){
      const id=en.target.id.replace('stop-','');
      rail.querySelectorAll('a').forEach(a=>a.setAttribute('aria-current',String(a.dataset.id===id)));
    }
  });
},{threshold:.55});
document.querySelectorAll('.stop').forEach(s=>io.observe(s));
const railIo=new IntersectionObserver(es=>{
  const any=[...document.querySelectorAll('.stop')].some(s=>{const r=s.getBoundingClientRect();return r.top<innerHeight*.6&&r.bottom>innerHeight*.4});
  rail.classList.toggle('show',any);
},{threshold:[0,.25,.5,.75,1]});
document.querySelectorAll('.stop').forEach(s=>railIo.observe(s));
addEventListener('scroll',()=>{
  const any=[...document.querySelectorAll('.stop')].some(s=>{const r=s.getBoundingClientRect();return r.top<innerHeight*.6&&r.bottom>innerHeight*.4});
  rail.classList.toggle('show',any);
},{passive:true});

/* product sheet */
let size=null,current=null,lastFocus=null;
function openPiece(k){
  const p=PIECES[k];current=k;size=null;lastFocus=document.activeElement;
  $('#sheet').innerHTML=`<button class="x" data-close aria-label="Close">×</button>
    <div class="sheet-grid">
      <div class="ph">${tee(140)}<small>Product photo coming soon</small></div>
      <div>
        <p class="s-ref">${p.ref}</p>
        <h2 class="s-name" id="sName">${p.name}</h2>
        <p class="s-price">Price announced at drop</p>
        <p class="s-note">${p.note}</p>
        <span class="lbl">Size</span>
        <div class="sizes">${SIZES.map(s=>`<button class="size" data-size="${s}" aria-pressed="false">${s}</button>`).join('')}</div>
        <button class="add" id="addBtn">Add to bag</button>
        <p class="hint" id="hint" aria-live="polite"></p>
      </div>
    </div>`;
  $('#sheet').classList.add('show');$('#scrim').classList.add('show');
  $('#sheet .x').focus();
}
$('#sheet').addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){closeAll();return}
  const s=e.target.closest('[data-size]');
  if(s){size=s.dataset.size;$('#sheet').querySelectorAll('.size').forEach(b=>b.setAttribute('aria-pressed',String(b===s)));$('#hint').textContent='';return}
  if(e.target.closest('#addBtn')){
    if(!size){$('#hint').textContent='Choose a size first.';return}
    bag.push({k:current,size});renderBag();closeAll();openBag();
  }
});

/* bag */
let bag=[];
function renderBag(){
  $('#count').textContent=bag.length;
  $('#bagList').innerHTML=bag.length?bag.map((it,i)=>`<li><div><b>${PIECES[it.k].name}</b><small>Size ${it.size}</small></div><button class="rm" data-rm="${i}">Remove</button></li>`).join(''):`<li class="empty" style="display:block;border:0">Your bag is empty.</li>`;
}
function openBag(){lastFocus=lastFocus||document.activeElement;$('#bag').classList.add('show');$('#scrim').classList.add('show');$('#closeBag').focus()}
function closeAll(){
  ['#sheet','#bag','#scrim'].forEach(s=>$(s).classList.remove('show'));
  if(lastFocus&&lastFocus.focus){lastFocus.focus({preventScroll:true});lastFocus=null}
}
$('#bagBtn').addEventListener('click',()=>{lastFocus=$('#bagBtn');openBag()});
$('#closeBag').addEventListener('click',closeAll);
$('#scrim').addEventListener('click',closeAll);
$('#bagList').addEventListener('click',e=>{const r=e.target.closest('[data-rm]');if(r){bag.splice(+r.dataset.rm,1);renderBag()}});
$('#checkout').addEventListener('click',()=>{toast('On the live site, this goes to your Shopify checkout.')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800)}
renderBag();
})();
</script>
</body>
</html>
